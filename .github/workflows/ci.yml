name: Continuous verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reject private and generated paths throughout history
        run: python scripts/check_publication.py --history
      - name: Scan complete Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: ops_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ops_test -d ops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPS_INTEGRATION_DATABASE_URL: postgresql+psycopg://ops_test:ephemeral-ci-only@localhost:5432/ops_test
      OPS_INTEGRATION_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --constraint requirements.lock -e '.[dev]'
          npm ci
          npx playwright install --with-deps chromium
      - name: Lint, format and type checks
        run: |
          python -m ruff check src tests scripts infra
          python -m ruff format --check src tests scripts infra
          python -m mypy src scripts infra
          node --check src/ops/static/app.js
      - name: Unit, API, MCP and real-service integration tests
        run: |
          python -m pytest -q tests infra --junitxml=artifacts/tests.xml
          node --test tests/frontend.test.mjs
          npm run test:browser
      - name: Benchmark regression gate
        run: python -m ops.evaluation --baseline evaluation/baseline.json
      - name: Dependency vulnerability scan
        run: |
          python -m pip_audit --format json --output artifacts/dependency-audit.json
          npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            artifacts/tests.xml
            artifacts/evaluation.json
            artifacts/evaluation.md
            artifacts/dependency-audit.json
          retention-days: 14

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - name: Validate Terraform without a cloud account
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate -no-color
          terraform test -no-color
      - name: Validate Compose
        env:
          OPS_SIGNING_KEY: non-secret-ci-validation-only-32-characters
        run: docker compose config --quiet
      - name: Build non-root application image
        run: docker build --tag acme-ops:${{ github.sha }} .
      - name: Scan image and configuration
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: acme-ops:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
